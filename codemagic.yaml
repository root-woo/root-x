# COURTLOG 아이폰 앱 빌드 (Codemagic)
# GitHub 저장소 맨 위에 이 파일과 src 폴더가 같이 있어야 해요.
# Codemagic 팀 설정 → Integrations → App Store Connect 에 등록한 API 키 이름을 아래 "COURTLOG ASC" 와 똑같이 맞춰 주세요.
workflows:
  ios-release:
    name: COURTLOG iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: COURTLOG ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: kr.axium.courtlog
      xcode: latest
      cocoapods: default
    scripts:
      - name: CocoaPods 설치
        script: |
          cd src
          pod install
      - name: 서명 설정
        script: xcode-project use-profiles
      - name: 빌드 번호 올리기
        script: |
          cd src
          agvtool new-version -all $BUILD_NUMBER
      - name: ipa 만들기
        script: |
          xcode-project build-ipa \
            --workspace "src/COURTLOG.xcworkspace" \
            --scheme "COURTLOG"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
